name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q
        env:
          # Las fixtures en conftest.py setean defaults si no hay valor;
          # acá pasamos los valores reales para CI.
          SECRET_KEY: ci-test-secret-key-de-mas-de-treinta-y-dos-chars
          ADMIN_EMAILS: admin@test.cl
