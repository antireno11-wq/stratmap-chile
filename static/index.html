<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stratmap Chile</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }
    .count-pill {
      background: #f1f5f9;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
    }
    .section-divider {
      margin: 28px 0;
      border: none;
      border-top: 1px solid #e2e8f0;
    }
    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .source-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      white-space: nowrap;
    }
    .phase-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 5px;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      font-weight: 500;
    }
    .proj-title {
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 400px;
    }
    .proj-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 1px;
    }
    .td-title { max-width: 400px; }
    .signal-dot { font-size: 11px; }
    .news-title {
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 560px;
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <div class="title">Stratmap</div>
        <div class="subtitle">Inteligencia Minera Chile</div>
      </div>
    </div>
    <div class="right">
      <a class="btn" href="/docs" target="_blank">API Docs</a>
      <button class="btn primary" id="btnRefresh">Actualizar</button>
    </div>
  </header>
  <main class="wrap">
    <section class="card">
      <div class="row">
        <input id="q" class="input" placeholder="Buscar (título, empresa, región, industria…)" />
        <select id="limit" class="input">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
        <button class="btn" id="btnSearch">Buscar</button>
      </div>
      <div class="status" id="status"></div>
    </section>

    <!-- Proyectos -->
    <section class="card">
      <div class="section-header">
        <span class="section-title">🏗 Proyectos</span>
        <span class="count-pill" id="projects-count">—</span>
      </div>
      <div class="tableWrap">
        <table class="table">
          <thead>
            <tr>
              <th>Score</th>
              <th>Proyecto</th>
              <th>Fuente</th>
              <th>Mandante</th>
              <th>Región</th>
              <th>Fase</th>
              <th>Fecha</th>
              <th>Link</th>
            </tr>
          </thead>
          <tbody id="tbody-projects">
            <tr><td colspan="8" class="muted">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Noticias -->
    <section class="card">
      <div class="section-header">
        <span class="section-title">📰 Noticias</span>
        <span class="count-pill" id="news-count">—</span>
      </div>
      <div class="tableWrap">
        <table class="table">
          <thead>
            <tr>
              <th>Titular</th>
              <th>Fuente</th>
              <th>Industria</th>
              <th>Fecha</th>
              <th>Link</th>
            </tr>
          </thead>
          <tbody id="tbody-news">
            <tr><td colspan="5" class="muted">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
