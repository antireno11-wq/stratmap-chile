<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Mandante — Stratmap Chile</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    :root {
      --sidebar: 230px; --blue: #2563eb; --blue-light: #eff6ff;
      --orange: #f97316; --border: #f0f2f5; --bg: #f7f8fc;
      --card: #ffffff; --text: #0d1117; --muted: #6b7280;
      --green: #10b981; --yellow: #f59e0b;
      --sidebar-bg: #1a1f2e; --sidebar-hover: #232940; --sidebar-active: #2a3355;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar { width: var(--sidebar); background: var(--sidebar-bg); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; overflow-y: auto; }
    .sidebar-brand { padding: 16px 18px; border-bottom: 1px solid #2d3548; display: flex; align-items: center; justify-content: center; background: #ffffff; }
    .sidebar-logo-img { width: 150px; height: auto; object-fit: contain; }
    .sidebar-section { padding: 20px 18px 5px; font-size: 9px; font-weight: 700; color: #6b7a99; letter-spacing: 0.1em; text-transform: uppercase; }
    .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 10px 18px; font-size: 14px; color: #6b7280; cursor: pointer; border-left: 3px solid transparent; text-decoration: none; transition: all 0.12s; font-weight: 500; }
    .sidebar-item:hover { background: var(--sidebar-hover); color: #d1d5db; border-left-color: #4b5a7a; }
    .sidebar-item.active { background: var(--sidebar-active); color: #fff; border-left-color: var(--orange); font-weight: 600; }
    .sidebar-item .icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }

    /* Main */
    .main { margin-left: var(--sidebar); flex: 1; padding: 32px 40px; max-width: 1100px; }

    /* Back */
    .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; margin-bottom: 24px; text-decoration: none; font-weight: 500; }
    .back-btn:hover { color: var(--blue); }

    /* Header */
    .mandante-header { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 28px 32px; margin-bottom: 24px; }
    .mandante-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .mandante-name { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
    .score-big { text-align: right; }
    .score-big-val { font-size: 52px; font-weight: 900; letter-spacing: -3px; line-height: 1; }
    .score-big-lbl { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
    .mandante-stats { display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap; }
    .mstat { display: flex; flex-direction: column; gap: 2px; }
    .mstat-val { font-size: 22px; font-weight: 800; }
    .mstat-lbl { font-size: 11px; color: var(--muted); font-weight: 600; }
    .signal-badge { display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;background:#fef9c3;color:#92400e; }

    /* Sections */
    .section-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 20px 24px; margin-bottom: 20px; }
    .section-title { font-size: 14px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .section-badge { background: var(--blue-light); color: var(--blue); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
    .empty-state { color: var(--muted); font-size: 13px; padding: 12px 0; }

    /* Table */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 12px; text-align: left; border-bottom: 1.5px solid var(--border); }
    td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbff; }
    .score-badge { display:inline-flex;align-items:center;padding:2px 8px;font-size:11px;font-weight:800;border-radius:6px; }
    .phase-badge { display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:#f3f4f6;color:#6b7280; }
    .phase-aprobado { background:#f0fdf4;color:#15803d; }
    .phase-calificacion { background:#eff6ff;color:#1a56db; }
    a.row-link { color: var(--blue); text-decoration: none; font-weight: 600; }
    a.row-link:hover { text-decoration: underline; }

    /* SEA cards */
    .sea-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 12px; }
    .sea-card { border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .sea-card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
    .sea-card-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .login-wall { text-align: center; padding: 60px 0; color: var(--muted); }

    /* Logo + summary */
    .company-logo { width:80px;height:80px;border-radius:20px;object-fit:contain;background:#fff;border:1.5px solid var(--border);padding:8px;flex-shrink:0;box-shadow:0 4px 16px rgba(0,0,0,0.08);transition:transform 0.2s,box-shadow 0.2s;cursor:default; }
    .company-logo:hover { transform:scale(1.06);box-shadow:0 8px 28px rgba(0,0,0,0.14); }
    .company-logo-placeholder { width:80px;height:80px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:white;flex-shrink:0;letter-spacing:-1px;box-shadow:0 4px 16px rgba(0,0,0,0.15);transition:transform 0.2s,box-shadow 0.2s;cursor:default; }
    .company-logo-placeholder:hover { transform:scale(1.06);box-shadow:0 8px 28px rgba(0,0,0,0.22); }
    .summary-card { background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:24px 28px;margin-bottom:20px; }
    .summary-header { display:flex;align-items:center;gap:18px;margin-bottom:16px; }
    .summary-company-info { flex:1; }
    .summary-tipo { font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px; }
    .summary-name { font-size:22px;font-weight:900;letter-spacing:-0.5px; }
    .summary-tags { display:flex;gap:6px;flex-wrap:wrap;margin-top:8px; }
    .summary-tag { font-size:11px;padding:2px 8px;border-radius:20px;background:#f3f4f6;color:#374151;font-weight:600; }
    .summary-body { font-size:14px;line-height:1.6;color:#374151;margin-bottom:12px; }
    .summary-presencia { font-size:13px;color:var(--muted);margin-bottom:6px; }
    .summary-actividad { font-size:13px;color:#059669;font-weight:500; }
    .summary-loading { color:var(--muted);font-size:13px;font-style:italic; }
    .summary-stats-row { display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--border); }
    .sstat { display:flex;flex-direction:column;gap:2px; }
    .sstat-val { font-size:20px;font-weight:800; }
    .sstat-lbl { font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em; }
    .login-wall a { color: var(--blue); font-weight: 600; }
  </style>
  <link rel="stylesheet" href="/theme.css?v=9" />
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-brand">
      <a href="/"><img src="/logo.png" alt="Stratmap" class="sidebar-logo-img" onerror="this.style.display='none'" /></a>
    </div>
    <div class="sidebar-section">Plataforma</div>
    <a class="sidebar-item" href="/"><span class="icon">⚡</span> Radar</a>
    <a class="sidebar-item" href="/kanban.html"><span class="icon">🗂</span> Pipeline</a>
    <a class="sidebar-item" href="/mapa.html"><span class="icon">🗺</span> Mapa</a>
    <a class="sidebar-item active" href="/mandantes.html"><span class="icon">🏢</span> Mandantes</a>
    <div class="sidebar-section">Configuración</div>
    <a class="sidebar-item" href="/preferences.html"><span class="icon">⚙️</span> Preferencias</a>
  </nav>

  <main class="main">
    <a class="back-btn" href="/">← Volver al Radar</a>

    <div id="content">
      <div style="color:var(--muted);padding:40px 0;text-align:center">Cargando...</div>
    </div>
  </main>

  <script src="/auth.js?v=9"></script>
  <script>if (!requireLogin()) { throw new Error('redir'); }</script>
  <script>
    // Generate a consistent gradient from company name
    const GRADIENTS = [
      ['#2563eb','#1e40af'], // blue
      ['#7c3aed','#4c1d95'], // violet
      ['#059669','#065f46'], // green
      ['#d97706','#92400e'], // amber
      ['#dc2626','#991b1b'], // red
      ['#0891b2','#164e63'], // cyan
      ['#db2777','#831843'], // pink
      ['#4f46e5','#312e81'], // indigo
    ];
    function companyGradient(name) {
      if (!name) return GRADIENTS[0];
      let h = 0;
      for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffffffff;
      return GRADIENTS[Math.abs(h) % GRADIENTS.length];
    }

    function escapeHTML(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return isNaN(d) ? '—' : d.toLocaleDateString('es-CL', { day:'2-digit', month:'2-digit', year:'2-digit' });
    }

    function scoreColor(s) {
      if (s >= 90) return ['#15803d','#f0fdf4'];
      if (s >= 70) return ['#1a56db','#eff6ff'];
      if (s >= 50) return ['#92400e','#fef3c7'];
      return ['#6b7280','#f9fafb'];
    }

    function phaseBadge(phase) {
      if (!phase) return '';
      const p = phase.toLowerCase();
      let cls = 'phase-badge';
      if (p.includes('aprobado') || p.includes('favorable')) cls += ' phase-aprobado';
      else if (p.includes('calificaci')) cls += ' phase-calificacion';
      return `<span class="${cls}">${escapeHTML(phase)}</span>`;
    }

    function calcConsolidado(proyectos, sea, noticias) {
      if (!proyectos.length && !sea.length) return 0;
      const avgProj = proyectos.length
        ? proyectos.reduce((s,p) => s + ((p.score||0) + (p.signal_score||0)), 0) / proyectos.length
        : 0;
      const seaPts = sea.reduce((s, item) => {
        const ph = (item.phase||'').toLowerCase();
        if (ph.includes('aprobado') || ph.includes('favorable')) return s + 20;
        if (ph.includes('desistido') || ph.includes('rechazado') || ph.includes('caducado')) return s;
        return s + 10;
      }, 0);
      const notPts = Math.min(noticias.length * 5, 15);
      const signals = proyectos.reduce((s,p) => s + (p.signal_score||0), 0);
      return Math.round(avgProj + seaPts + notPts + signals);
    }

    async function loadMandante() {
      // Check session
      const session = JSON.parse(localStorage.getItem('stratmap_session') || '{}');
      if (!session.username) {
        document.getElementById('content').innerHTML = `
          <div class="login-wall">
            <div style="font-size:40px;margin-bottom:16px">🔒</div>
            <div style="font-size:18px;font-weight:700;margin-bottom:8px">Acceso restringido</div>
            <div style="margin-bottom:20px">Inicia sesión para ver el perfil de este mandante</div>
            <a href="/login.html">→ Ingresar</a>
          </div>`;
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const empresa = params.get('empresa') || '';
      if (!empresa) { window.location.href = '/'; return; }

      try {
        // Fetch detail + summary in parallel
        const [detailRes, summaryRes] = await Promise.all([
          apiFetch(`/mandantes/detail?company=${encodeURIComponent(empresa)}`),
          apiFetch(`/mandantes/summary/${encodeURIComponent(empresa)}`),
        ]);
        const data    = await detailRes.json();
        const summary = await summaryRes.json().catch(() => null);
        renderMandante(empresa, data, summary);
      } catch(e) {
        document.getElementById('content').innerHTML = '<div style="color:red;padding:20px">Error cargando datos del mandante.</div>';
      }
    }

    const LICIT_SRC = new Set(['Codelco','ENAMI','SEA','sea','MLP Proveedores','Ariba Codelco','Chile Compra','MOP','COCHILCO']);

    function renderMandante(empresa, data, summaryData) {
      const proyectos  = data.proyectos || [];
      const sea        = data.sea_prospectos || [];
      const noticias   = data.noticias || [];

      // Split proyectos into licitaciones vs concesiones SIGEX
      const licitaciones = proyectos.filter(p => LICIT_SRC.has(p.source));
      const concesiones  = proyectos.filter(p => !LICIT_SRC.has(p.source));

      const score = calcConsolidado(proyectos, sea, noticias);
      const [sc, sbg] = scoreColor(score);
      const totalSignal = proyectos.reduce((s,p) => s + (p.signal_score||0), 0);

      // Logo — Clearbit logo API por dominio probable
      const companyKey = empresa.toLowerCase()
        .replace(/\s+(s\.?a\.?|spa|ltda|corp|inc|chile)\b/g,'')
        .trim().replace(/\s+/g,'-');
      const knownDomains = {
        'codelco':'codelco.cl','enami':'enami.cl','bhp':'bhp.com',
        'antofagasta-minerals':'antofagastaminerals.com','freeport':'fcx.com',
        'teck':'teck.com','glencore':'glencore.com','anglo-american':'angloamerican.com',
        'barrick':'barrick.com','kinross':'kinross.com','goldfields':'goldfields.com',
        'rio-tinto':'riotinto.com','vale':'vale.com','newmont':'newmont.com',
        'lumina-copper':'luminacopper.com',
      };
      const domain = knownDomains[companyKey] || null;
      const logoUrl = domain
        ? `https://logo.clearbit.com/${domain}`
        : null;
      const initials = empresa.split(' ').filter(w=>w.length>2).slice(0,2).map(w=>w[0].toUpperCase()).join('') || empresa.slice(0,2).toUpperCase();
      const [gc1, gc2] = companyGradient(empresa);
      const placeholderStyle = `background:linear-gradient(135deg,${gc1},${gc2})`;

      // Summary section
      const sm = summaryData && summaryData.summary;
      const smStats = summaryData && summaryData.stats;
      const heatLabel = data.heat_label || '';
      let summaryHtml = `
        <div class="summary-card">
          <div class="summary-header">
            ${logoUrl
              ? `<img class="company-logo" src="${logoUrl}"
                   onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
                   alt="${escapeHTML(empresa)}">
                 <div class="company-logo-placeholder" style="${placeholderStyle};display:none">${initials}</div>`
              : `<div class="company-logo-placeholder" style="${placeholderStyle}">${initials}</div>`
            }
            <div class="summary-company-info">
              ${sm ? `<div class="summary-tipo">${escapeHTML(sm.tipo||'Empresa Minera')}</div>` : ''}
              <div class="summary-name">${escapeHTML(decodeURIComponent(empresa))}</div>
              <div class="summary-tags">
                ${heatLabel ? `<span class="summary-tag">${escapeHTML(heatLabel)}</span>` : ''}
                ${sm && sm.minerales_principales ? sm.minerales_principales.slice(0,3).map(m=>`<span class="summary-tag">⛏ ${escapeHTML(m)}</span>`).join('') : ''}
                ${sm && sm.regiones_clave ? sm.regiones_clave.slice(0,2).map(r=>`<span class="summary-tag">📍 ${escapeHTML(r)}</span>`).join('') : ''}
              </div>
            </div>
          </div>
          ${sm ? `
            <div class="summary-body">${escapeHTML(sm.descripcion||'')}</div>
            ${sm.presencia_chile ? `<div class="summary-presencia">🌎 ${escapeHTML(sm.presencia_chile)}</div>` : ''}
            ${sm.actividad_reciente ? `<div class="summary-actividad">📈 ${escapeHTML(sm.actividad_reciente)}</div>` : ''}
          ` : `<div class="summary-loading">Generando resumen con IA...</div>`}
          ${smStats ? `
            <div class="summary-stats-row">
              ${smStats.n_licitaciones > 0 ? `<div class="sstat"><div class="sstat-val" style="color:var(--blue)">${smStats.n_licitaciones}</div><div class="sstat-lbl">Licitaciones</div></div>` : ''}
              ${smStats.n_sigex > 0 ? `<div class="sstat"><div class="sstat-val" style="color:#7c3aed">${smStats.n_sigex}</div><div class="sstat-lbl">Concesiones SIGEX</div></div>` : ''}
              ${smStats.n_sea > 0 ? `<div class="sstat"><div class="sstat-val" style="color:#059669">${smStats.n_sea}</div><div class="sstat-lbl">Prospectos SEA</div></div>` : ''}
              ${smStats.total_jobs > 0 ? `<div class="sstat"><div class="sstat-val" style="color:#d97706">${smStats.total_jobs}</div><div class="sstat-lbl">Empleos activos</div></div>` : ''}
            </div>
          ` : ''}
        </div>`;

      // Header
      let html = summaryHtml + `
        <div class="mandante-header">
          <div class="mandante-header-top">
            <div>
              <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">Mandante</div>
              <div class="mandante-name">${escapeHTML(decodeURIComponent(empresa))}</div>
            </div>
            <div class="score-big">
              <div class="score-big-val" style="color:${sc}">${score}</div>
              <div class="score-big-lbl">Score consolidado</div>
            </div>
          </div>
          <div class="mandante-stats">
            <div class="mstat">
              <div class="mstat-val" style="color:var(--blue)">${licitaciones.length}</div>
              <div class="mstat-lbl">Licitaciones</div>
            </div>
            <div class="mstat">
              <div class="mstat-val" style="color:#7c3aed">${concesiones.length}</div>
              <div class="mstat-lbl">Concesiones SIGEX</div>
            </div>
            <div class="mstat">
              <div class="mstat-val" style="color:#059669">${sea.length}</div>
              <div class="mstat-lbl">Prospectos SEA</div>
            </div>
            <div class="mstat">
              <div class="mstat-val" style="color:var(--muted)">${noticias.length}</div>
              <div class="mstat-lbl">Noticias recientes</div>
            </div>
            ${totalSignal > 0 ? `<div class="mstat">
              <span class="signal-badge">⚡ +${totalSignal} señales</span>
            </div>` : ''}
          </div>
        </div>`;

      // Helper: render a proyectos table
      function proyectosTable(items, emptyMsg) {
        if (!items.length) return `<div class="empty-state">${emptyMsg}</div>`;
        let t = `<table><thead><tr><th>Score</th><th>Proyecto</th><th>Fuente</th><th>Región</th><th>Fase</th><th>Señales</th><th>Fecha</th></tr></thead><tbody>`;
        items.forEach(p => {
          const radar = (p.score||0) + (p.signal_score||0);
          const [c,bg] = scoreColor(radar);
          const sig = p.signal_score > 0
            ? `<span class="signal-badge" title="${escapeHTML(p.signal_detail||'')}">⚡ +${p.signal_score}</span>` : '—';
          t += `<tr>
            <td><span class="score-badge" style="color:${c};background:${bg}">${radar}</span></td>
            <td><a class="row-link" href="${escapeHTML(p.url||'#')}" target="_blank">${escapeHTML(p.title)}</a></td>
            <td style="color:var(--muted);font-size:12px">${escapeHTML(p.source||'—')}</td>
            <td>${escapeHTML(p.region||'—')}</td>
            <td>${phaseBadge(p.phase)}</td>
            <td>${sig}</td>
            <td style="color:var(--muted);font-size:12px">${formatDate(p.published_at)}</td>
          </tr>`;
        });
        t += '</tbody></table>';
        return t;
      }

      // Licitaciones
      html += `<div class="section-card">
        <div class="section-title">📋 Licitaciones <span class="section-badge">${licitaciones.length}</span></div>`;
      html += proyectosTable(licitaciones, 'Sin licitaciones activas registradas');
      html += '</div>';

      // Concesiones SIGEX
      html += `<div class="section-card">
        <div class="section-title">⛏️ Concesiones SIGEX <span class="section-badge">${concesiones.length}</span></div>`;
      html += proyectosTable(concesiones, 'Sin concesiones SIGEX registradas');
      html += '</div>';

      // Prospectos SEA
      html += `<div class="section-card">
        <div class="section-title">📋 Prospectos SEA <span class="section-badge">${sea.length}</span>
          <span style="font-size:11px;color:var(--muted);font-weight:400">— evaluación ambiental en curso o aprobada</span>
        </div>`;
      if (sea.length) {
        html += '<div class="sea-grid">';
        sea.forEach(s => {
          const ph = (s.phase||'').toLowerCase();
          let borderColor = 'var(--border)';
          if (ph.includes('aprobado') || ph.includes('favorable')) borderColor = '#86efac';
          else if (ph.includes('calificaci')) borderColor = '#93c5fd';
          html += `<div class="sea-card" style="border-color:${borderColor}">
            <div class="sea-card-title">
              <a class="row-link" href="${escapeHTML(s.url||'#')}" target="_blank">${escapeHTML(s.title)}</a>
            </div>
            <div class="sea-card-meta">
              ${phaseBadge(s.phase)}
              <span style="font-size:11px;color:var(--muted)">${escapeHTML(s.region||'')}</span>
            </div>
          </div>`;
        });
        html += '</div>';
      } else {
        html += '<div class="empty-state">Sin prospectos SEA registrados</div>';
      }
      html += '</div>';

      // Noticias recientes
      if (noticias.length) {
        html += `<div class="section-card">
          <div class="section-title">📰 Noticias recientes <span class="section-badge">${noticias.length}</span></div>
          <table><thead><tr><th>Titular</th><th>Fuente</th><th>Fecha</th></tr></thead><tbody>`;
        noticias.forEach(n => {
          html += `<tr>
            <td><a class="row-link" href="${escapeHTML(n.url||'#')}" target="_blank">${escapeHTML(n.title)}</a></td>
            <td style="color:var(--muted);font-size:12px">${escapeHTML(n.source||'')}</td>
            <td style="color:var(--muted);font-size:12px">${formatDate(n.published_at)}</td>
          </tr>`;
        });
        html += '</tbody></table></div>';
      }

      document.getElementById('content').innerHTML = html;
      document.title = `${decodeURIComponent(empresa)} — Stratmap`;
    }

    loadMandante();
  </script>
  <script src="/mobile-nav.js?v=9" defer></script>
</body>
</html>
