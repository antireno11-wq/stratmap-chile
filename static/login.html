<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Ingresar · Stratmap</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border: 1px solid #e8edf2;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .logo-wrap img {
      height: 40px;
    }
    .logo-text {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
    }
    .logo-sub {
      font-size: 11px;
      color: #8896a5;
      font-weight: 500;
    }
    h2 {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      color: #0f172a;
      margin-bottom: 14px;
      outline: none;
      transition: border 0.15s;
    }
    input:focus { border-color: #1a56db; }
    .btn-login {
      width: 100%;
      padding: 11px;
      background: #e05a1e;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s;
    }
    .btn-login:hover { background: #c44d18; }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 14px;
      display: none;
    }
    .demo-hint {
      margin-top: 20px;
      padding: 12px 14px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      font-size: 11px;
      color: #0369a1;
      line-height: 1.6;
    }
    .demo-hint strong { font-weight: 700; }
    .divider {
      border: none;
      border-top: 1px solid #e8edf2;
      margin: 20px 0;
    }
    .link-back {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      text-decoration: none;
      margin-top: 16px;
    }
    .link-back:hover { color: #1a56db; }
  </style>
  <link rel="stylesheet" href="/theme.css?v=8" />
</head>
<body>
  <div class="card">
    <div style="text-align:center;margin-bottom:28px">
      <img src="/logo.png" alt="Stratmap" style="height:52px;object-fit:contain" onerror="this.style.display='none'">
    </div>

    <h2>Ingresa a tu cuenta</h2>
    <p class="subtitle">Accede a tu radar personalizado con scores y preferencias.</p>

    <div class="error" id="error-msg">Usuario o contraseña incorrectos.</div>

    <label>Email</label>
    <input type="email" id="username" placeholder="usuario@empresa.cl" autocomplete="username" />

    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />

    <button class="btn-login" onclick="doLogin()">Ingresar →</button>

    <hr class="divider">
    <a class="link-back" href="/">← Volver</a>
  </div>

  <script>
    async function doLogin() {
      const email = document.getElementById('username').value.trim();
      const pass  = document.getElementById('password').value;
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';

      if (!email || !pass) {
        errEl.textContent = 'Ingresa email y contraseña.';
        errEl.style.display = 'block';
        return;
      }

      try {
        const r = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });
        if (!r.ok) {
          errEl.textContent = 'Email o contraseña incorrectos.';
          errEl.style.display = 'block';
          return;
        }
        const data = await r.json();

        localStorage.setItem('stratmap_session', JSON.stringify({
          token: data.token,
          email: data.email,
          name:  data.name,
          loggedAt: new Date().toISOString()
        }));

        // Defaults de prefs si no existen
        const prefs = JSON.parse(localStorage.getItem('stratmap_prefs') || '{}');
        if (!prefs.industries) {
          localStorage.setItem('stratmap_prefs', JSON.stringify({
            industries: ['Minería'],
            keywords: [],
            preferred_regions: [],
            companies: [],
            phases: [],
            sources: []
          }));
        }

        window.location.href = '/';
      } catch (e) {
        errEl.textContent = 'Error de conexión, intenta de nuevo.';
        errEl.style.display = 'block';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    // Si ya hay sesión válida, redirigir
    try {
      const s = JSON.parse(localStorage.getItem('stratmap_session') || '{}');
      if (s.token) window.location.href = '/';
    } catch (e) {}
  </script>
  <script src="/mobile-nav.js?v=8" defer></script>
</body>
</html>
